[package]
name = "image_compresser"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "bmp",
    "tiff",
    "webp",
    "ico",
    "tga",
    "pnm",
    "qoi",
    "hdr",
    "dds",
    "rayon",
] }
webp = "0.3"
walkdir = "2"
rayon = "1"

[dev-dependencies]
tempfile = "3"
